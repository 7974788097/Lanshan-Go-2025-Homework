version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: a_pile_of_shit_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: Users
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - app_network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}" ]
      timeout: 10s
      retries: 30
      interval: 5s
  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: a_pile_of_shit_redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - app_network
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 10
    # 不映射端口到宿主机

  # 应用服务 - 只开放业务接口
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a_pile_of_shit_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # MySQL配置 - 使用容器内部网络通信
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_DBNAME_Users: ${MYSQL_DBNAME_Users:-Users}
      MYSQL_DBNAME_DATA: ${MYSQL_DBNAME_DATA:-Data}
      MYSQL_HOST: mysql  # 通过容器名访问
      MYSQL_PORT: 3306

      # Redis配置 - 使用容器内部网络通信
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      REDIS_HOST: redis  # 通过容器名访问
      REDIS_PORT: 6379

      # JWT Token配置
      TOKEN_PASSWORD: ${TOKEN_PASSWORD:-123456}

      # Snowflake配置
      SNOW_NODE_ID: ${SNOW_NODE_ID:-1}
      BEGINNING_TIME: ${BEGINNING_TIME:-1735660800}

      # 时区
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"  # 只开放业务接口
    volumes:
      - ./logs:/app/logs
    networks:
      - app_network

# 数据卷
volumes:
  mysql_data:
  redis_data:

# 网络
networks:
  app_network:
    driver: bridge